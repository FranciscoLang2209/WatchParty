name: Matches import batch

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Base de destino'
        type: choice
        required: true
        default: demo
        options:
          - demo
          - production
      batch:
        description: 'Lote CODIGO:AÑO separado por comas. Obligatorio en production. En demo, vacío usa el piloto.'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: matches-sync-production
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.target == 'production' && 'Production' || 'demo' }}

    steps:
      - name: Check production input
        if: inputs.target == 'production'
        env:
          MATCHES_IMPORT_BATCH: ${{ inputs.batch }}
        run: |
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo "La carga en producción solo se puede ejecutar desde main." >&2
            exit 1
          fi
          if [[ ! "$MATCHES_IMPORT_BATCH" =~ [^[:space:]] ]]; then
            echo "Ingresá el lote histórico en batch para cargar producción." >&2
            exit 1
          fi

      - name: Check demo target
        if: inputs.target == 'demo'
        env:
          DEMO_SUPABASE_URL: ${{ secrets.DEMO_SUPABASE_URL }}
          PRODUCTION_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          if [ -n "$DEMO_SUPABASE_URL" ] && [ "$DEMO_SUPABASE_URL" = "$PRODUCTION_SUPABASE_URL" ]; then
            echo "DEMO_SUPABASE_URL apunta a la base de producción." >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Import matches batch
        run: pnpm --filter @watchparty/api matches:import-batch
        env:
          MATCHES_IMPORT_BATCH: ${{ inputs.batch }}
          FOOTBALL_DATA_ORG_BASE_URL: ${{ secrets.FOOTBALL_DATA_ORG_BASE_URL }}
          FOOTBALL_DATA_ORG_API_KEY: ${{ secrets.FOOTBALL_DATA_ORG_API_KEY }}
          SUPABASE_URL: ${{ secrets[inputs.target == 'production' && 'SUPABASE_URL' || 'DEMO_SUPABASE_URL'] }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets[inputs.target == 'production' && 'SUPABASE_SERVICE_ROLE_KEY' || 'DEMO_SUPABASE_SERVICE_ROLE_KEY'] }}
          SUPABASE_ANON_KEY: ${{ secrets[inputs.target == 'production' && 'SUPABASE_ANON_KEY' || 'DEMO_SUPABASE_ANON_KEY'] }}
          WEB_ORIGIN: ${{ secrets[inputs.target == 'production' && 'WEB_ORIGIN' || 'DEMO_WEB_ORIGIN'] }}
