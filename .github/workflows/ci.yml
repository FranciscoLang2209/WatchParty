name: CI

# Qué corre en cada evento:
#   push (ramas)      -> controles rápidos: formato, lint y typecheck.
#   push a main       -> validación completa: lo anterior + tests y build, después
#                        de cada merge (un PR desactualizado puede romper main).
#   pull_request      -> validación completa: lo anterior + tests y build.
#   workflow_dispatch -> validación completa, a pedido (diagnóstico).
# La suite completa se ejecuta antes de subir con `pnpm validate` (hook pre-push).
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        if: github.event_name != 'push' || github.ref == 'refs/heads/main'
        run: pnpm test

      - name: Build
        if: github.event_name != 'push' || github.ref == 'refs/heads/main'
        run: pnpm build
